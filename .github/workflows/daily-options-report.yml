name: Daily Options Report

# GitHub schedules an attempt at 6:45 AM Pacific every day (including DST).
# Actual starts may be delayed by GitHub Actions.
# Reports are generated and emailed only on NYSE trading days;
# workflow_dispatch allows on-demand runs on any day.
on:
  schedule:
    - cron: "45 6 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-options-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate: run scheduled reports only on NYSE trading days;
      # manually dispatched runs bypass the trading-day check.
      - name: Gate (NYSE trading day)
        id: gate
        run: |
          python -m pip install --quiet pandas_market_calendars
          python <<'PY'
          import datetime, os, sys
          from zoneinfo import ZoneInfo

          def emit(run: bool):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"should_run={'true' if run else 'false'}\n")

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          pac = datetime.datetime.now(ZoneInfo("America/Los_Angeles"))
          print(f"event={event} pacific={pac.isoformat()}")

          if event == "workflow_dispatch":
              print("Manual dispatch -> run")
              emit(True)
              sys.exit(0)

          import pandas_market_calendars as mcal
          today = pac.date().isoformat()
          if mcal.get_calendar("NYSE").schedule(start_date=today, end_date=today).empty:
              print(f"{today} is not an NYSE trading day -> skip")
              emit(False)
              sys.exit(0)

          print(f"{today} is an NYSE trading day -> run")
          emit(True)
          PY

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        if: steps.gate.outputs.should_run == 'true'
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
        run: python main.py --config config.yaml

      - name: Email report (inline HTML)
        if: steps.gate.outputs.should_run == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: diboyed@gmail.com
        run: |
          python <<'PY'
          import os, glob, smtplib, datetime
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo

          reports = sorted(glob.glob("reports/*_options_report.html"))
          if not reports:
              raise SystemExit("No HTML report found in reports/ — did the run succeed?")
          path = reports[-1]
          with open(path, encoding="utf-8") as fh:
              html = fh.read()

          pac_date = datetime.datetime.now(ZoneInfo("America/Los_Angeles")).date().isoformat()
          msg = EmailMessage()
          msg["Subject"] = f"Options Screener Report — {pac_date}"
          msg["From"] = os.environ["MAIL_USERNAME"]
          msg["To"] = os.environ["MAIL_TO"]
          msg.set_content("Your options screener report is below. Open in an HTML-capable mail client to view it.")
          msg.add_alternative(html, subtype="html")

          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls()
              s.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
              s.send_message(msg)
          print(f"Sent {path} to {os.environ['MAIL_TO']}")
          PY

      - name: Upload report artifact
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: options-report
          path: reports/*_options_report.*
          retention-days: 14
          if-no-files-found: error
